[collectors]

[collectors.gtfs]

PATH = "stib.collectors.gtfs.STIBGTFSCollector"
DATA_FORMAT = "gtfs"
DATA_TYPE = "binary"
SCHEDULE = "04:20"

[collectors.shapefile_raw]

PATH = "stib.collectors.shapefile.STIBShapeFilesCollector"
DATA_FORMAT = "shapefile"
DATA_TYPE = "binary"
SCHEDULE = "03:20"

[collectors.stops_by_line]

PATH = "stib.collectors.stops_by_line.STIBStopsByLineCollector"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SCHEDULE = "00:20"

[collectors.stop_details]

PATH = "stib.collectors.stop_details.STIBStopDetailsCollector"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SCHEDULE = "00:20"

[collectors.vehicle_distance]

PATH = "stib.collectors.vehicle_distance.STIBVehiclePositionsCollector"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SCHEDULE = "20s"
PARQUETIZE = { BATCH = "1h", GROUPS = [{GROUP="1d"},{GROUP="1w", KEYS=["lineId"]},], SCHEMA = { type = "array", items = { type = "object", properties = { directionId = { type = "string" }, distanceFromPoint = { type = "integer" }, pointId = { type = "string" } } } } }

[collectors.travellers_information]

PATH = "stib.collectors.travellers_information.STIBTravellersInformationCollector"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SCHEDULE = "15m"

[collectors.waiting_times]

PATH = "stib.collectors.waiting_times.STIBWaitingTimesCollector"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SCHEDULE = "60s"


[harvesters]

[harvesters.gtfs_parquet]

PATH = "gtfs_parquet_harvester.GTFSParquetHarvester"
DATA_FORMAT = "gtfs-parquet"
DATA_TYPE = "binary"
SOURCE = "stib.gtfs"

[harvesters.shapefile]

PATH = "stib.harvesters.shapefile_geojson.STIBShapefileGeoJSONHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.shapefile_raw"

[harvesters.stops]

PATH = "stib.harvesters.stops.STIBStopsHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.stops_by_line"
DEPENDENCIES = ["stop_details"]

[harvesters.segments]

PATH = "stib.harvesters.segments.STIBSegmentsHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.shapefile"
DEPENDENCIES = ["stops"]

[harvesters.speed]
PATH = "stib.harvesters.speed.StibSegmentsSpeedHarvester"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SOURCE = "stib.vehicle_distance"
# One new snapshot per run; the earlier snapshots come from the optional
# dependency so consecutive runs overlap. Three of them cover STIB serving the
# same payload twice in a row, which the harvester skips.
OPTIONAL_DEPENDENCIES = ["vehicle_distance"]
OPTIONAL_DEPENDENCIES_LIMIT = [3]

[harvesters.aggregated_speed]
PATH = "stib.harvesters.aggregated_speed.StibSegmentsAggregatedSpeedHarvester"
DATA_FORMAT = "json"
DATA_TYPE = "json"
SOURCE = "stib.speed"
# Rolling window: the newest speed snapshot plus the ones before it, trimmed to
# ten minutes by the harvester. 40 rows cover the window at a 20 s cadence.
OPTIONAL_DEPENDENCIES = ["speed"]
OPTIONAL_DEPENDENCIES_LIMIT = [40]

[harvesters.vehicle_position_geometry]

PATH = "stib.harvesters.vehicle_position_geometry.STIBVehiclePositionGeometryHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.vehicle_distance"
DEPENDENCIES = ["segments", "stops"]


[harvesters.vehicle_identify]

PATH = "stib.harvesters.identify_vehicle.identify_vehicle.STIBVehicleIdentifyHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.vehicle_position_geometry"
SOURCE_RANGE = 20
SOURCE_RANGE_STRICT = false
MULTIPLE_RESULTS = true
DEPENDENCIES = ["shapefile"]
DEPENDENCIES_LIMIT = [1]
OPTIONAL_DEPENDENCIES = ["vehicle_identify"]
OPTIONAL_DEPENDENCIES_LIMIT = [10]

[harvesters.vehicle_trip]

# Every vehicle with the GTFS trip it runs, live (components/stib/harvesters/
# vehicle_trip). The tracker keeps its state in the process between runs and
# rebuilds it from the last hour of polls (180 at 20 s) after a restart, a gap
# or a new timetable; the previous snapshot carries identities across it.
# LATEST_ONLY: a missed poll is worthless live, and a first run must not start
# from the beginning of the vehicle_distance archive.
PATH = "stib.harvesters.vehicle_trip.STIBVehicleTripHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "stib.vehicle_distance"
LATEST_ONLY = true
DEPENDENCIES = ["gtfs_parquet", "segments"]
OPTIONAL_DEPENDENCIES = ["vehicle_distance", "vehicle_trip"]
OPTIONAL_DEPENDENCIES_LIMIT = [180, 1]
# One row per vehicle and poll: its properties plus lon/lat (run_parquetize._rows).
PARQUETIZE = { BATCH = "1h", GROUPS = [{GROUP="1d"},{GROUP="1w", KEYS=["lineId"]},], SCHEMA = { type = "array", items = { type = "object", required = ["uuid", "lineId"], properties = { uuid = { type = "string" }, lineId = { type = "string" }, directionId = { type = "string" }, pointId = { type = "string" }, distanceFromPoint = { type = "integer" }, tripId = { type = ["string", "null"] }, startDate = { type = ["string", "null"] }, delay = { type = ["integer", "null"] }, lon = { type = "number" }, lat = { type = "number" } } } } }

[harvesters.punctuality]

PATH = "stib.harvesters.punctuality.STIBPunctualityHarvester"
DATA_FORMAT = "punctuality-parquet"
DATA_TYPE = "binary"
SOURCE = "stib.vehicle_distance"
SOURCE_RANGE = "1d@Europe/Brussels"
# Only the timetable is declared. `stib.segments` would refine a hop length where
# the feed has not observed one often enough, but a dependency clamps the
# backfill to its own first datapoint — segments begins 2024-08-21 where the
# timetable now reaches back to 2024-04-05, so declaring it would cost four and a
# half months of history to buy a refinement worth little: the April 2024
# benchmark, built without segments, still reached 92.9% of trips and 93.8% of
# stop calls.
DEPENDENCIES = ["stib.gtfs_parquet"]


[handlers]

[handlers.gtfs_rt_vehicle_position]

PATH = "stib.handlers.gtfs_rt.STIBGTFSRTVehiclePositionHandler"
DATA_FORMAT = "gtfs_realtime"
DATA_TYPE = "binary"
QUERY_PARAMETERS = { start_timestamp = "int", end_timestamp = "int" }

[handlers.gtfs_rt_trip_update]

PATH = "stib.handlers.gtfs_rt.STIBGTFSRTTripUpdateHandler"
DATA_FORMAT = "gtfs_realtime"
DATA_TYPE = "binary"
QUERY_PARAMETERS = { start_timestamp = "int", end_timestamp = "int" }

[handlers.trips]

PATH = "stib.handlers.trips.STIBTripsHandler"
DATA_FORMAT = "mf-json"
DATA_TYPE = "json"
QUERY_PARAMETERS = { start_timestamp = "int", end_timestamp = "int" }
