[collectors]

[collectors.gtfs]

PATH = "tec.collectors.gtfs.TECGTFSStaticCollector"
DATA_FORMAT = "gtfs"
DATA_TYPE = "binary"
SCHEDULE = "03:45"

# The legacy gtfsrt.tectime.be trips feed (collector tec.collectors.gtfs_realtime)
# is not polled any more since 2026-09-21: it carried trip updates only, the
# same ones gtfs_rt_trip_update gets from the Belgian Mobility API, and it
# rate-limited us at 20 s. The tec_gtfs_realtime table keeps its history.


[collectors.gtfs_rt_alert]

PATH = "tec.collectors.gtfs_rt_alert.TECGTFSRTAlertCollector"
DATA_FORMAT = "gtfs_realtime"
DATA_TYPE = "binary"
SCHEDULE = "15m"

[collectors.gtfs_rt_trip_update]

PATH = "tec.collectors.gtfs_rt_trip_update.TECGTFSRTTripUpdateCollector"
DATA_FORMAT = "gtfs_realtime"
DATA_TYPE = "binary"
SCHEDULE = "20s"

[collectors.gtfs_rt_vehicle_position]

PATH = "tec.collectors.gtfs_rt_vehicle_position.TECGTFSRTVehiclePositionCollector"
DATA_FORMAT = "gtfs_realtime"
DATA_TYPE = "binary"
SCHEDULE = "20s"

[harvesters]

[harvesters.gtfs_parquet]

PATH = "gtfs_parquet_harvester.GTFSParquetHarvester"
DATA_FORMAT = "gtfs-parquet"
DATA_TYPE = "binary"
SOURCE = "tec.gtfs"

[harvesters.punctuality]

PATH = "punctuality_harvester.PunctualityHarvester"
DATA_FORMAT = "punctuality-parquet"
DATA_TYPE = "binary"
SOURCE = "tec.gtfs_rt_trip_update"
SOURCE_RANGE = "1d@Europe/Brussels"
