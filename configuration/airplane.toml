[collectors]

[collectors.opensky_position]

PATH = "airplane.opensky.OpenSkyPositionCollector"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SCHEDULE = "5m"

[collectors.adsb_lol_position]

PATH = "airplane.adsb_lol.AdsbLolPositionCollector"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SCHEDULE = "1m"

[harvesters]

[harvesters.unified_position]

PATH = "airplane.harvesters.unified_position.AirplaneUnifiedPositionHarvester"
DATA_FORMAT = "geojson"
DATA_TYPE = "json"
SOURCE = "airplane.opensky_position"
# Optional: the merge keeps running on OpenSky alone when adsb.lol has no row.
OPTIONAL_DEPENDENCIES = ["airplane.adsb_lol_position"]
